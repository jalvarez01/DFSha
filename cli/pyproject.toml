[project]
name = "dfsha-cli"
version = "0.1.0"
description = "Cliente CLI de DFSha (gestión de FS + transferencia de archivos)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
dfsha = "dfsha_cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dfsha_cli"]
