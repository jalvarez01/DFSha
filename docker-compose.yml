# docker-compose del clúster DFSha (Hito 3): 2 ControlNodes (líder +
# respaldo) + 4 DataNodes, con TLS en todas las conexiones, replicación de
# bloques (factor 3) y cifrado en reposo.
#
# Antes de levantarlo por primera vez (genera certs/ y .env, que NO se suben
# al repositorio):
#   pip install cryptography
#   python scripts/setup_cluster.py
#
# Uso:
#   docker compose up --build -d
#   dfsha login ana -u https://localhost:8000,https://localhost:8010 --ca-cert certs/ca.crt
#   dfsha put archivo.bin && dfsha get archivo.bin copia.bin && dfsha status
#   python scripts/verify_hito3.py            # verificación end-to-end con caídas
#
# Componentes:
#   - controlnode-1 : arranca como PRIMARIO (líder). Metadatos en SQLite.
#   - controlnode-2 : RESPALDO. Sigue al líder aplicando su log de cambios
#                     (ControlNode <-> ControlNode) y toma el control si cae.
#   - datanode-1..4 : guardan bloques cifrados. Cada bloque va a 3 de ellos
#                     (cadena DataNode -> DataNode); si uno cae, el líder
#                     ordena re-replicar sus bloques en los demás.
#
# --- Contrato ControlNode <-> DataNode -------------------------------------
# Cada DataNode late a TODOS los ControlNodes (DFSHA_CONTROLNODE_URLS); el
# líder responde con órdenes (borrar, copiar a otro DataNode) y los
# respaldos solo anotan el informe de testigo que usan para el failover. El
# ControlNode NUNCA llama a un DataNode. Todo va con tokens firmados con
# DFSHA_CLUSTER_SECRET, que debe ser el mismo en todos los nodos.
#
# `host`/`port` anunciados son los que usa el CLIENTE (localhost y el puerto
# publicado en el anfitrión). Entre DataNodes se usa la dirección interna
# (nombre del servicio). Para un cliente en OTRA máquina, cambia
# DFSHA_DATANODE_ADVERTISE_HOST por la IP/nombre del anfitrión (y añádelo a
# los certificados en scripts/setup_cluster.py).

x-controlnode: &controlnode
  build: .
  image: dfsha-controlnode:hito3
  networks:
    - dfsha_net
  healthcheck:
    test: ["CMD", "python", "-c", "import ssl,urllib.request,sys; sys.exit(0 if urllib.request.urlopen('https://localhost:8000/health', context=ssl._create_unverified_context()).status == 200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 5

x-controlnode-env: &controlnode-env
  DFSHA_JWT_SECRET: "${DFSHA_JWT_SECRET:?Corre antes: python scripts/setup_cluster.py}"
  DFSHA_CLUSTER_SECRET: "${DFSHA_CLUSTER_SECRET:?Corre antes: python scripts/setup_cluster.py}"
  DFSHA_CA_CERT: /certs/ca.crt
  DFSHA_DATABASE_URL: "sqlite:////data/dfsha.db"
  DFSHA_STORAGE_DIR: "/data/blocks"
  DFSHA_BLOCK_SIZE_BYTES: "8388608"       # 8 MiB
  DFSHA_REPLICATION_FACTOR: "3"
  DFSHA_HEARTBEAT_TTL_SECONDS: "30"
  DFSHA_HA_FAILOVER_SECONDS: "15"

x-datanode: &datanode
  build: ./datanode
  image: dfsha-datanode:hito3
  depends_on:
    controlnode-1:
      condition: service_started
  networks:
    - dfsha_net

x-datanode-env: &datanode-env
  DFSHA_CLUSTER_SECRET: "${DFSHA_CLUSTER_SECRET:?Corre antes: python scripts/setup_cluster.py}"
  DFSHA_CONTROLNODE_URLS: "https://controlnode-1:8000,https://controlnode-2:8000"
  DFSHA_CA_CERT: /certs/ca.crt
  DFSHA_DATANODE_ADVERTISE_HOST: "localhost"
  DFSHA_DATANODE_STORAGE_DIR: "/data/blocks"
  DFSHA_HEARTBEAT_INTERVAL: "10"

services:
  controlnode-1:
    <<: *controlnode
    container_name: dfsha-controlnode-1
    environment:
      <<: *controlnode-env
      DFSHA_CONTROLNODE_ID: "cn1"
      DFSHA_HA_INITIAL_ROLE: "primary"
      DFSHA_HA_PEERS: "https://controlnode-2:8000"
      DFSHA_PUBLIC_URL: "https://localhost:8000"
      DFSHA_TLS_CERT: /certs/controlnode-1.crt
      DFSHA_TLS_KEY: /certs/controlnode-1.key
    ports:
      - "8000:8000"
    volumes:
      - controlnode1_data:/data
      - ./certs:/certs:ro

  controlnode-2:
    <<: *controlnode
    container_name: dfsha-controlnode-2
    depends_on:
      controlnode-1:
        condition: service_started
    environment:
      <<: *controlnode-env
      DFSHA_CONTROLNODE_ID: "cn2"
      DFSHA_HA_INITIAL_ROLE: "standby"
      DFSHA_HA_PEERS: "https://controlnode-1:8000"
      DFSHA_PUBLIC_URL: "https://localhost:8010"
      DFSHA_TLS_CERT: /certs/controlnode-2.crt
      DFSHA_TLS_KEY: /certs/controlnode-2.key
    ports:
      - "8010:8000"
    volumes:
      - controlnode2_data:/data
      - ./certs:/certs:ro

  datanode-1:
    <<: *datanode
    container_name: dfsha-datanode-1
    environment:
      <<: *datanode-env
      DFSHA_DATANODE_ID: "datanode-1"
      DFSHA_DATANODE_ADVERTISE_PORT: "8001"
      DFSHA_DATANODE_INTERNAL_HOST: "datanode-1"
      DFSHA_DATANODE_STORAGE_KEY: "${DFSHA_DN1_STORAGE_KEY:?Corre antes: python scripts/setup_cluster.py}"
      DFSHA_TLS_CERT: /certs/datanode-1.crt
      DFSHA_TLS_KEY: /certs/datanode-1.key
    ports:
      - "8001:8001"
    volumes:
      - datanode1_data:/data
      - ./certs:/certs:ro

  datanode-2:
    <<: *datanode
    container_name: dfsha-datanode-2
    environment:
      <<: *datanode-env
      DFSHA_DATANODE_ID: "datanode-2"
      DFSHA_DATANODE_ADVERTISE_PORT: "8002"
      DFSHA_DATANODE_INTERNAL_HOST: "datanode-2"
      DFSHA_DATANODE_STORAGE_KEY: "${DFSHA_DN2_STORAGE_KEY:?Corre antes: python scripts/setup_cluster.py}"
      DFSHA_TLS_CERT: /certs/datanode-2.crt
      DFSHA_TLS_KEY: /certs/datanode-2.key
    ports:
      - "8002:8002"
    volumes:
      - datanode2_data:/data
      - ./certs:/certs:ro

  datanode-3:
    <<: *datanode
    container_name: dfsha-datanode-3
    environment:
      <<: *datanode-env
      DFSHA_DATANODE_ID: "datanode-3"
      DFSHA_DATANODE_ADVERTISE_PORT: "8003"
      DFSHA_DATANODE_INTERNAL_HOST: "datanode-3"
      DFSHA_DATANODE_STORAGE_KEY: "${DFSHA_DN3_STORAGE_KEY:?Corre antes: python scripts/setup_cluster.py}"
      DFSHA_TLS_CERT: /certs/datanode-3.crt
      DFSHA_TLS_KEY: /certs/datanode-3.key
    ports:
      - "8003:8003"
    volumes:
      - datanode3_data:/data
      - ./certs:/certs:ro

  datanode-4:
    <<: *datanode
    container_name: dfsha-datanode-4
    environment:
      <<: *datanode-env
      DFSHA_DATANODE_ID: "datanode-4"
      DFSHA_DATANODE_ADVERTISE_PORT: "8004"
      DFSHA_DATANODE_INTERNAL_HOST: "datanode-4"
      DFSHA_DATANODE_STORAGE_KEY: "${DFSHA_DN4_STORAGE_KEY:?Corre antes: python scripts/setup_cluster.py}"
      DFSHA_TLS_CERT: /certs/datanode-4.crt
      DFSHA_TLS_KEY: /certs/datanode-4.key
    ports:
      - "8004:8004"
    volumes:
      - datanode4_data:/data
      - ./certs:/certs:ro

networks:
  dfsha_net:
    driver: bridge

volumes:
  controlnode1_data:
  controlnode2_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
  datanode4_data:
