# docker-compose del clúster DFSha (Hito 2): 1 ControlNode + N DataNodes.
#
# Levanta el servicio distribuido completo en una red privada (`dfsha_net`),
# tal como pide la Opción 1 (C/S con distribución S2S, sistema autónomo):
#
#   - controlnode : esta app FastAPI en su rol de NameNode/HDFS. Guarda solo
#                   metadatos (namespace + tabla de bloques) y decide el
#                   placement. Es el único con estado en SQLite.
#   - datanode-1..3 : servicios de bloques (carpeta ./datanode). Cada uno se
#                   registra y late contra el ControlNode, almacena los
#                   bloques que le asignen y valida el JWT de los clientes.
#
# Uso:
#   docker compose up --build -d
#   dfsha login <usuario> -u http://localhost:8000
#   dfsha put archivo.bin && dfsha get archivo.bin copia.bin
#   python scripts/verify_hito2.py            # verificación end-to-end
#
# Para escalar el número de DataNodes basta con copiar un bloque `datanode-N`
# (cada uno con su node_id, su puerto y su volumen). Se dejan 3 como ejemplo.
#
# --- Contrato ControlNode <-> DataNode -------------------------------------
# Cada DataNode lee estas variables de entorno y, al arrancar, hace
# `POST {DFSHA_CONTROLNODE_URL}/datanodes/register` con:
#     { "node_id": DFSHA_DATANODE_ID,
#       "host":    DFSHA_DATANODE_ADVERTISE_HOST,
#       "port":    DFSHA_DATANODE_ADVERTISE_PORT }
# y luego `POST /datanodes/heartbeat` cada DFSHA_HEARTBEAT_INTERVAL segundos
# (holgadamente < heartbeat_ttl del ControlNode, 30 s por defecto). La
# respuesta del heartbeat trae las órdenes de borrado de bloques; el
# ControlNode NUNCA llama al DataNode, así que no necesita alcanzarlo.
#
# `host`/`port` son la dirección con la que el CLIENTE alcanza al DataNode
# para subir/bajar bloques. Se anuncia `localhost` y cada DataNode publica
# su puerto en el host (8001..8003), así que la CLI corriendo en la máquina
# anfitriona funciona sin configurar nada. Para un cliente en OTRA máquina,
# cambia DFSHA_DATANODE_ADVERTISE_HOST por la IP/nombre del anfitrión.
#
# DFSHA_JWT_SECRET debe ser el MISMO en el ControlNode y en los DataNodes:
# el DataNode valida con él los tokens que emite el ControlNode.

services:
  controlnode:
    build: .
    image: dfsha-controlnode:hito2
    container_name: dfsha-controlnode
    environment:
      # Secreto JWT compartido por todo el servicio (obligatorio fuera de dev).
      DFSHA_JWT_SECRET: "cambia-esto-en-produccion"
      # Metadatos en el volumen persistente.
      DFSHA_DATABASE_URL: "sqlite:////data/dfsha.db"
      DFSHA_STORAGE_DIR: "/data/blocks"
      # Tamaño de bloque y ventana de liveness (opcionales; valen los defaults).
      DFSHA_BLOCK_SIZE_BYTES: "8388608"       # 8 MiB
      DFSHA_HEARTBEAT_TTL_SECONDS: "30"
    ports:
      - "8000:8000"
    volumes:
      - controlnode_data:/data
    networks:
      - dfsha_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  datanode-1:
    build: ./datanode
    image: dfsha-datanode:hito2
    container_name: dfsha-datanode-1
    depends_on:
      controlnode:
        condition: service_healthy
    environment:
      DFSHA_DATANODE_ID: "datanode-1"
      DFSHA_CONTROLNODE_URL: "http://controlnode:8000"
      DFSHA_DATANODE_ADVERTISE_HOST: "localhost"
      DFSHA_DATANODE_ADVERTISE_PORT: "8001"
      DFSHA_DATANODE_STORAGE_DIR: "/data/blocks"
      DFSHA_HEARTBEAT_INTERVAL: "10"
      DFSHA_JWT_SECRET: "cambia-esto-en-produccion"
    ports:
      - "8001:8001"
    volumes:
      - datanode1_data:/data
    networks:
      - dfsha_net

  datanode-2:
    build: ./datanode
    image: dfsha-datanode:hito2
    container_name: dfsha-datanode-2
    depends_on:
      controlnode:
        condition: service_healthy
    environment:
      DFSHA_DATANODE_ID: "datanode-2"
      DFSHA_CONTROLNODE_URL: "http://controlnode:8000"
      DFSHA_DATANODE_ADVERTISE_HOST: "localhost"
      DFSHA_DATANODE_ADVERTISE_PORT: "8002"
      DFSHA_DATANODE_STORAGE_DIR: "/data/blocks"
      DFSHA_HEARTBEAT_INTERVAL: "10"
      DFSHA_JWT_SECRET: "cambia-esto-en-produccion"
    ports:
      - "8002:8002"
    volumes:
      - datanode2_data:/data
    networks:
      - dfsha_net

  datanode-3:
    build: ./datanode
    image: dfsha-datanode:hito2
    container_name: dfsha-datanode-3
    depends_on:
      controlnode:
        condition: service_healthy
    environment:
      DFSHA_DATANODE_ID: "datanode-3"
      DFSHA_CONTROLNODE_URL: "http://controlnode:8000"
      DFSHA_DATANODE_ADVERTISE_HOST: "localhost"
      DFSHA_DATANODE_ADVERTISE_PORT: "8003"
      DFSHA_DATANODE_STORAGE_DIR: "/data/blocks"
      DFSHA_HEARTBEAT_INTERVAL: "10"
      DFSHA_JWT_SECRET: "cambia-esto-en-produccion"
    ports:
      - "8003:8003"
    volumes:
      - datanode3_data:/data
    networks:
      - dfsha_net

networks:
  dfsha_net:
    driver: bridge

volumes:
  controlnode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
